{% extends "base.html" %}{% block title %}Profile{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-md-7"><div class="card border-0 shadow-sm p-4"><h2>My Profile</h2><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" value="{{user.name}}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{user.email}}" disabled><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" value="{{user.phone}}"><label class="form-label">Address</label><textarea class="form-control mb-3" name="address">{{user.address}}</textarea><button class="btn btn-success">Update Profile</button></form></div></div></div>{% endblock %}
