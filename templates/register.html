{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-md-6"><div class="card border-0 shadow-sm p-4"><h2>Create account</h2><form method="post"><input class="form-control mb-3" name="name" placeholder="Full name" required><input class="form-control mb-3" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" type="password" name="password" placeholder="Password (6+ characters)" required><select class="form-select mb-3" name="role"><option value="buyer">Buyer</option><option value="farmer">Farmer</option></select><input class="form-control mb-3" name="phone" placeholder="Phone"><input class="form-control mb-3" name="address" placeholder="Address"><button class="btn btn-success w-100">Register</button></form></div></div></div>{% endblock %}
