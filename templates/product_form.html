{% extends "base.html" %}{% block title %}{{'Edit' if p else 'Add'}} Product{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm p-4"><h2>{{'Edit' if p else 'Add'}} Product</h2><form method="post"><label class="form-label">Product name</label><input class="form-control mb-3" name="name" value="{{p.name if p else ''}}" required><label class="form-label">Category</label><select class="form-select mb-3" name="category">{% for c in ['Vegetables','Fruits','Grains','Dairy','Other'] %}<option {% if p and p.category==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select><div class="row"><div class="col"><input class="form-control mb-3" type="number" step="0.01" name="price" placeholder="Price" value="{{p.price if p else ''}}" required></div><div class="col"><input class="form-control mb-3" type="number" step="0.01" name="quantity" placeholder="Quantity" value="{{p.quantity if p else ''}}" required></div><div class="col"><select class="form-select mb-3" name="unit"><option>kg</option><option>quintal</option><option>litre</option><option>piece</option></select></div></div><input class="form-control mb-3" name="location" placeholder="Farm location" value="{{p.location if p else ''}}"><textarea class="form-control mb-3" name="description" placeholder="Description">{{p.description if p else ''}}</textarea><button class="btn btn-success">Save Product</button> <a class="btn btn-light" href="{{url_for('dashboard')}}">Cancel</a></form></div></div></div>{% endblock %}
